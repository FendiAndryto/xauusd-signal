services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xauusd-signal-dashboard
    ports:
      - "8000:8000"
    environment:
      - MT5_MODE=bridge
      - MT5_BRIDGE_URL=http://host.docker.internal:8081
      - SYMBOL=XAUUSDm
      - POLL_INTERVAL_MS=150
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
